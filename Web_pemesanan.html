<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan</title>
</head>
<body>
    <header>
        <table align="center" border="1">
            <tbody>
                <tr>
                    <td><a>Home</a></td>
                    <td><a>Generate Link</a></td>
                    <td><a>Transaction History</a></td>
                    <td><a>Policy</a></td>
                    <td><a>Logout</a></td>
                </tr>
        </table>
    </header>
    <form align="left" action="Web_Pesanan_berhasil.html" method="post">
        <fieldset>
            <legend>Form Pemesanan</legend>
                <label for="file">Upload Gambar Barang:</label>
                <input type="file" name="file" accept=".JPG, .JPEG, .PNG" required><br><br>
            <label for="judul">Judul:</label>
            <input type="text" id="judul" name="judul" required><br><br>

            <label for="deskripsi">Deskripsi:</label>
            <textarea id="deskripsi" name="deskripsi" maxlength="200" required></textarea><br><br>

            <label for="bank">Bank:</label>
            <select id="bank" name="bank" required>
                <option value="">Pilih Bank</option>
                <option value="bank1">BRI</option>
                <option value="bank2">BCA</option>
                <option value="bank3">Seabank</option>
            </select><br><br>

            <label for="name">Pemegang Rekening:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="jumlah">Transaksi:
                <input type="number" id="jumlah" name="jumlah" min="1" required>
            </label><br>
            <label>*Jika transaksi lebih dari 3, pilih 3 opsi dari dropdown:</label><br><br>

            <input type="checkbox" id="email" name="email" required>
            <label for="email">Kirimkan konfirmasi ke email saya.</label><br><br>
            <input type="checkbox" id="phone" name="phone" required>
            <label for="phone">Kirimkan konfirmasi ke nomor telepon saya.</label><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required="@gmail.com"><br><br>
            <label for="phone">Nomor Telepon:</label>
            <input type="tel" id="phone" name="phone" maxlength="12" required><br><br>

            <input type="submit" value="Pesan">
            <input type="reset" value="Reset">
            
        </fieldset>
    </form>
</body>
</html>
